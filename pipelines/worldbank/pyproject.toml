[project]
name = "worldbank"
version = "0.1.0"
description = "World Bank API pipeline: traceable yearly country indicators."
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.14",
    "pyyaml>=6",
    "requests>=2.34",
    "tenacity>=9.2",
    "typer>=0.29",
]

[project.scripts]
worldbank = "worldbank.cli:app"

[build-system]
requires = ["uv_build>=0.10,<0.14"]
build-backend = "uv_build"
