version: 2

# The answers to the brief's questions (FR-ANA-1 to FR-ANA-4), ready for analysts and exported as
# CSV. They read only the marts (ADR-0027); each states the question it answers and its grain.

models:
  - name: rpt_completeness_by_cell
    description: >
      FR-ANA-1, cell level: every expected country × indicator × year with its status: present,
      null_value (the API returned the row with a null) or missing_row (no row at all). Grain:
      one country × indicator × year (ADR-0008).
    data_tests:
      - unique_combination:
          arguments:
            columns: [country_id, indicator_id, observation_year]
    columns:
      - name: value_status
        data_tests:
          - accepted_values:
              arguments:
                values: [present, null_value, missing_row]

  - name: rpt_completeness_by_series
    description: >
      FR-ANA-1, series level: each country × indicator over the reporting years is complete
      (every year present), incomplete (some) or missing (none), with `n_present` of
      `n_expected` and how the gaps split between null values and missing rows. Grain: one
      country × indicator (ADR-0008).
    data_tests:
      - unique_combination:
          arguments:
            columns: [country_id, indicator_id]
    columns:
      - name: series_status
        data_tests:
          - accepted_values:
              arguments:
                values: [complete, incomplete, missing]

  - name: rpt_year_over_year
    description: >
      FR-ANA-2: each country × indicator × year's change from the year before, as
      `absolute_change` and `percent_change` (in percent). When a change can't be computed it's
      null, never 0, and `null_change_reason` says why: current_missing, prior_out_of_scope
      (always the first reporting year), prior_missing or prior_zero (only the percentage is
      null). Grain: one country × indicator × year (ADR-0009).
    data_tests:
      - unique_combination:
          arguments:
            columns: [country_id, indicator_id, observation_year]
    columns:
      - name: null_change_reason
        data_tests:
          - accepted_values:
              arguments:
                values: [current_missing, prior_out_of_scope, prior_missing, prior_zero]

  - name: rpt_latest_year_by_country
    description: >
      FR-ANA-3, main view: each country at its own latest year with a value, per indicator;
      `latest_year` shows which year, since it can differ by country. `rank_in_indicator`
      ranks countries by that value (1 = highest). A country with no value keeps its row, with
      nulls. Grain: one country × indicator (ADR-0009).
    data_tests:
      - unique_combination:
          arguments:
            columns: [country_id, indicator_id]

  - name: rpt_latest_common_year
    description: >
      FR-ANA-3, like-for-like view: per indicator, every country at `common_year`, the latest
      year all countries have a value for, ranked by that value (1 = highest). Grain: one
      country × indicator (ADR-0009).
    data_tests:
      - unique_combination:
          arguments:
            columns: [country_id, indicator_id]

  - name: rpt_income_group_by_year
    description: >
      FR-ANA-4: the brief's four indicators per income group and year (ADR-0043). `group_value`
      is aggregated the way each indicator requires, and `aggregation` says how: population and
      GDP summed; GDP per capita as total GDP / total population; life expectancy as a
      population-weighted mean. Only countries with everything the formula needs contribute:
      `n_countries_with_data` of `n_countries`; with none, the value is null, never 0. An
      indicator outside the four has no row. Income groups are the current classification
      applied to every year (ADR-0011, ADR-0040; see the README's assumptions). Grain: one income
      group × indicator × year.
    data_tests:
      - unique_combination:
          arguments:
            columns: [income_group_id, indicator_id, observation_year]
    columns:
      - name: n_countries_with_data
        data_tests: [not_null]
