version: 2

unit_tests:
  - name: series_are_complete_incomplete_or_missing
    description: >
      All years present is complete, some is incomplete, none is missing; null values and
      missing rows both count as gaps (ADR-0008).
    model: rpt_completeness_by_series
    given:
      - input: ref('fct_country_indicator_values')
        rows:
          - {country_id: BRA, indicator_id: SP.POP.TOTL, observation_year: 2023, value_status: present}
          - {country_id: BRA, indicator_id: SP.POP.TOTL, observation_year: 2024, value_status: present}
          - {country_id: IND, indicator_id: SP.POP.TOTL, observation_year: 2023, value_status: present}
          - {country_id: IND, indicator_id: SP.POP.TOTL, observation_year: 2024, value_status: null_value}
          - {country_id: ZAF, indicator_id: SP.POP.TOTL, observation_year: 2023, value_status: missing_row}
          - {country_id: ZAF, indicator_id: SP.POP.TOTL, observation_year: 2024, value_status: null_value}
      - input: ref('dim_countries')
        rows:
          - {country_id: BRA, country_name: Brazil}
          - {country_id: IND, country_name: India}
          - {country_id: ZAF, country_name: South Africa}
      - input: ref('dim_indicators')
        rows:
          - {indicator_id: SP.POP.TOTL, indicator_name: "Population, total"}
    expect:
      rows:
        - {country_id: BRA, series_status: complete, n_present: 2, n_expected: 2,
           n_null_value: 0, n_missing_row: 0}
        - {country_id: IND, series_status: incomplete, n_present: 1, n_expected: 2,
           n_null_value: 1, n_missing_row: 0}
        - {country_id: ZAF, series_status: missing, n_present: 0, n_expected: 2,
           n_null_value: 1, n_missing_row: 1}

  - name: year_over_year_changes_and_every_null_reason
    description: >
      A normal change, the first year (prior out of scope), a missing current value, a missing
      prior value, and a prior of zero, where only the percentage is null (ADR-0009).
    model: rpt_year_over_year
    given:
      - input: ref('fct_country_indicator_values')
        rows:
          - {country_id: BRA, indicator_id: X, observation_year: 2018, indicator_value: 100, value_status: present}
          - {country_id: BRA, indicator_id: X, observation_year: 2019, indicator_value: 110, value_status: present}
          - {country_id: BRA, indicator_id: X, observation_year: 2020, indicator_value: null, value_status: missing_row}
          - {country_id: BRA, indicator_id: X, observation_year: 2021, indicator_value: 0, value_status: present}
          - {country_id: BRA, indicator_id: X, observation_year: 2022, indicator_value: 5, value_status: present}
      - input: ref('dim_countries')
        rows:
          - {country_id: BRA, country_name: Brazil}
      - input: ref('dim_indicators')
        rows:
          - {indicator_id: X, indicator_name: An indicator}
    expect:
      rows:
        - {observation_year: 2018, absolute_change: null, percent_change: null,
           null_change_reason: prior_out_of_scope}
        - {observation_year: 2019, absolute_change: 10, percent_change: 10,
           null_change_reason: null}
        - {observation_year: 2020, absolute_change: null, percent_change: null,
           null_change_reason: current_missing}
        - {observation_year: 2021, absolute_change: null, percent_change: null,
           null_change_reason: prior_missing}
        - {observation_year: 2022, absolute_change: 5, percent_change: null,
           null_change_reason: prior_zero}

  - name: each_country_is_shown_at_its_own_latest_year
    description: >
      Brazil's latest is 2024, India's 2023; South Africa has no value and keeps a row with
      nulls, unranked.
    model: rpt_latest_year_by_country
    given:
      - input: ref('fct_country_indicator_values')
        rows:
          - {country_id: BRA, indicator_id: X, observation_year: 2023, indicator_value: 10, value_status: present}
          - {country_id: BRA, indicator_id: X, observation_year: 2024, indicator_value: 12, value_status: present}
          - {country_id: IND, indicator_id: X, observation_year: 2023, indicator_value: 30, value_status: present}
          - {country_id: IND, indicator_id: X, observation_year: 2024, indicator_value: null, value_status: missing_row}
          - {country_id: ZAF, indicator_id: X, observation_year: 2023, indicator_value: null, value_status: null_value}
          - {country_id: ZAF, indicator_id: X, observation_year: 2024, indicator_value: null, value_status: missing_row}
      - input: ref('dim_countries')
        rows:
          - {country_id: BRA, country_name: Brazil}
          - {country_id: IND, country_name: India}
          - {country_id: ZAF, country_name: South Africa}
      - input: ref('dim_indicators')
        rows:
          - {indicator_id: X, indicator_name: An indicator}
    expect:
      rows:
        - {country_id: BRA, latest_year: 2024, indicator_value: 12, rank_in_indicator: 2}
        - {country_id: IND, latest_year: 2023, indicator_value: 30, rank_in_indicator: 1}
        - {country_id: ZAF, latest_year: null, indicator_value: null, rank_in_indicator: null}

  - name: the_common_year_is_the_latest_every_country_has
    description: >
      Brazil has 2023 and 2024, India only 2023, so 2023 is the latest year both have, and both
      are compared on it.
    model: rpt_latest_common_year
    given:
      - input: ref('fct_country_indicator_values')
        rows:
          - {country_id: BRA, indicator_id: X, observation_year: 2023, indicator_value: 10, value_status: present}
          - {country_id: BRA, indicator_id: X, observation_year: 2024, indicator_value: 12, value_status: present}
          - {country_id: IND, indicator_id: X, observation_year: 2023, indicator_value: 30, value_status: present}
          - {country_id: IND, indicator_id: X, observation_year: 2024, indicator_value: null, value_status: missing_row}
      - input: ref('dim_countries')
        rows:
          - {country_id: BRA, country_name: Brazil}
          - {country_id: IND, country_name: India}
          - {country_id: ZAF, country_name: South Africa}
      - input: ref('dim_indicators')
        rows:
          - {indicator_id: X, indicator_name: An indicator}
    expect:
      rows:
        - {country_id: BRA, common_year: 2023, indicator_value: 10, rank_in_indicator: 2}
        - {country_id: IND, common_year: 2023, indicator_value: 30, rank_in_indicator: 1}

  - name: without_a_common_year_every_country_keeps_a_row
    description: South Africa has no value in any year, so no year is common to all countries.
    model: rpt_latest_common_year
    given:
      - input: ref('fct_country_indicator_values')
        rows:
          - {country_id: BRA, indicator_id: X, observation_year: 2023, indicator_value: 10, value_status: present}
          - {country_id: BRA, indicator_id: X, observation_year: 2024, indicator_value: 12, value_status: present}
          - {country_id: IND, indicator_id: X, observation_year: 2023, indicator_value: 30, value_status: present}
          - {country_id: IND, indicator_id: X, observation_year: 2024, indicator_value: null, value_status: missing_row}
          - {country_id: ZAF, indicator_id: X, observation_year: 2023, indicator_value: null, value_status: null_value}
          - {country_id: ZAF, indicator_id: X, observation_year: 2024, indicator_value: null, value_status: missing_row}
      - input: ref('dim_countries')
        rows:
          - {country_id: BRA, country_name: Brazil}
          - {country_id: IND, country_name: India}
          - {country_id: ZAF, country_name: South Africa}
      - input: ref('dim_indicators')
        rows:
          - {indicator_id: X, indicator_name: An indicator}
    expect:
      rows:
        - {country_id: BRA, common_year: null, indicator_value: null, rank_in_indicator: null}
        - {country_id: IND, common_year: null, indicator_value: null, rank_in_indicator: null}
        - {country_id: ZAF, common_year: null, indicator_value: null, rank_in_indicator: null}

  - name: income_groups_average_the_countries_with_a_value
    description: >
      Two of three high-income countries have a value: the average is theirs, (200 + 100) / 2,
      not a sum and not divided by three, and the coverage says 2 of 3. A null value and a
      missing row both count as no value.
    model: rpt_income_group_by_year
    given:
      - input: ref('fct_country_indicator_values')
        rows:
          - {country_id: USA, indicator_id: POP, observation_year: 2024, indicator_value: 200, value_status: present}
          - {country_id: DEU, indicator_id: POP, observation_year: 2024, indicator_value: 100, value_status: present}
          - {country_id: GBR, indicator_id: POP, observation_year: 2024, indicator_value: null, value_status: missing_row}
          - {country_id: USA, indicator_id: LIFE, observation_year: 2024, indicator_value: 80, value_status: present}
          - {country_id: DEU, indicator_id: LIFE, observation_year: 2024, indicator_value: null, value_status: null_value}
          - {country_id: GBR, indicator_id: LIFE, observation_year: 2024, indicator_value: 70, value_status: present}
      - input: ref('dim_countries')
        rows:
          - {country_id: USA, income_group_id: HIC}
          - {country_id: DEU, income_group_id: HIC}
          - {country_id: GBR, income_group_id: HIC}
      - input: ref('dim_income_groups')
        rows:
          - {income_group_id: HIC, income_group_name: High income}
      - input: ref('dim_indicators')
        rows:
          - {indicator_id: POP, indicator_name: Population}
          - {indicator_id: LIFE, indicator_name: Life expectancy}
    expect:
      rows:
        - {indicator_id: POP, average_value: 150, n_countries: 3, n_countries_with_data: 2}
        - {indicator_id: LIFE, average_value: 75, n_countries: 3, n_countries_with_data: 2}

  - name: an_income_group_without_data_has_a_null_value_not_zero
    model: rpt_income_group_by_year
    given:
      - input: ref('fct_country_indicator_values')
        rows:
          - {country_id: IND, indicator_id: POP, observation_year: 2024, indicator_value: null, value_status: null_value}
      - input: ref('dim_countries')
        rows:
          - {country_id: IND, income_group_id: LMC}
      - input: ref('dim_income_groups')
        rows:
          - {income_group_id: LMC, income_group_name: Lower middle income}
      - input: ref('dim_indicators')
        rows:
          - {indicator_id: POP, indicator_name: Population}
    expect:
      rows:
        - {income_group_id: LMC, indicator_id: POP, average_value: null, n_countries: 1,
           n_countries_with_data: 0}
