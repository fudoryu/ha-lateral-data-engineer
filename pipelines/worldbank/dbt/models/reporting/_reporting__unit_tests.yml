version: 2

unit_tests:
  - name: cells_and_series_are_present_incomplete_or_missing
    description: >
      Each cell keeps its status; a series with every year present is complete, with some is
      incomplete, with none is missing. Null values and missing rows both count as gaps
      (ADR-0008).
    model: rpt_completeness
    given:
      - input: ref('fct_country_indicator_values')
        rows:
          - {country_id: BRA, indicator_id: SP.POP.TOTL, observation_year: 2023, value_status: present}
          - {country_id: BRA, indicator_id: SP.POP.TOTL, observation_year: 2024, value_status: present}
          - {country_id: IND, indicator_id: SP.POP.TOTL, observation_year: 2023, value_status: present}
          - {country_id: IND, indicator_id: SP.POP.TOTL, observation_year: 2024, value_status: null_value}
          - {country_id: ZAF, indicator_id: SP.POP.TOTL, observation_year: 2023, value_status: missing_row}
          - {country_id: ZAF, indicator_id: SP.POP.TOTL, observation_year: 2024, value_status: null_value}
      - input: ref('dim_countries')
        rows:
          - {country_id: BRA, country_name: Brazil}
          - {country_id: IND, country_name: India}
          - {country_id: ZAF, country_name: South Africa}
      - input: ref('dim_indicators')
        rows:
          - {indicator_id: SP.POP.TOTL, indicator_name: "Population, total"}
    expect:
      rows:
        - {country_id: BRA, observation_year: 2023, value_status: present, series_status: complete}
        - {country_id: BRA, observation_year: 2024, value_status: present, series_status: complete}
        - {country_id: IND, observation_year: 2023, value_status: present, series_status: incomplete}
        - {country_id: IND, observation_year: 2024, value_status: null_value, series_status: incomplete}
        - {country_id: ZAF, observation_year: 2023, value_status: missing_row, series_status: missing}
        - {country_id: ZAF, observation_year: 2024, value_status: null_value, series_status: missing}

  - name: year_over_year_changes_and_every_null_reason
    description: >
      A normal change, the first year (prior out of scope), a missing current value, a missing
      prior value, and a prior of zero, where only the percentage is null (ADR-0009).
    model: rpt_year_over_year
    given:
      - input: ref('fct_country_indicator_values')
        rows:
          - {country_id: BRA, indicator_id: X, observation_year: 2018, indicator_value: 100, value_status: present}
          - {country_id: BRA, indicator_id: X, observation_year: 2019, indicator_value: 110, value_status: present}
          - {country_id: BRA, indicator_id: X, observation_year: 2020, indicator_value: null, value_status: missing_row}
          - {country_id: BRA, indicator_id: X, observation_year: 2021, indicator_value: 0, value_status: present}
          - {country_id: BRA, indicator_id: X, observation_year: 2022, indicator_value: 5, value_status: present}
      - input: ref('dim_countries')
        rows:
          - {country_id: BRA, country_name: Brazil}
      - input: ref('dim_indicators')
        rows:
          - {indicator_id: X, indicator_name: An indicator}
    expect:
      rows:
        - {observation_year: 2018, absolute_change: null, percent_change: null,
           null_change_reason: prior_out_of_scope}
        - {observation_year: 2019, absolute_change: 10, percent_change: 10,
           null_change_reason: null}
        - {observation_year: 2020, absolute_change: null, percent_change: null,
           null_change_reason: current_missing}
        - {observation_year: 2021, absolute_change: null, percent_change: null,
           null_change_reason: prior_missing}
        - {observation_year: 2022, absolute_change: 5, percent_change: null,
           null_change_reason: prior_zero}

  - name: each_country_at_its_latest_year_and_everyone_at_the_common_year
    description: >
      Brazil's latest year is 2024, India's 2023, so they're ranked on different years; 2023 is
      the latest year both have, and on it India (30) ranks above Brazil (10).
    model: rpt_latest_year
    given:
      - input: ref('fct_country_indicator_values')
        rows:
          - {country_id: BRA, indicator_id: X, observation_year: 2023, indicator_value: 10, value_status: present}
          - {country_id: BRA, indicator_id: X, observation_year: 2024, indicator_value: 12, value_status: present}
          - {country_id: IND, indicator_id: X, observation_year: 2023, indicator_value: 30, value_status: present}
          - {country_id: IND, indicator_id: X, observation_year: 2024, indicator_value: null, value_status: missing_row}
      - input: ref('dim_countries')
        rows:
          - {country_id: BRA, country_name: Brazil}
          - {country_id: IND, country_name: India}
          - {country_id: ZAF, country_name: South Africa}
      - input: ref('dim_indicators')
        rows:
          - {indicator_id: X, indicator_name: An indicator}
    expect:
      rows:
        - {country_id: BRA, latest_year: 2024, latest_value: 12, latest_rank: 2,
           common_year: 2023, common_value: 10, common_rank: 2}
        - {country_id: IND, latest_year: 2023, latest_value: 30, latest_rank: 1,
           common_year: 2023, common_value: 30, common_rank: 1}

  - name: a_country_without_values_keeps_its_row_and_removes_the_common_year
    description: >
      South Africa has no value in any year: it keeps a row, unranked, and no year is common to
      all countries, so every common column is null.
    model: rpt_latest_year
    given:
      - input: ref('fct_country_indicator_values')
        rows:
          - {country_id: BRA, indicator_id: X, observation_year: 2023, indicator_value: 10, value_status: present}
          - {country_id: BRA, indicator_id: X, observation_year: 2024, indicator_value: 12, value_status: present}
          - {country_id: IND, indicator_id: X, observation_year: 2023, indicator_value: 30, value_status: present}
          - {country_id: IND, indicator_id: X, observation_year: 2024, indicator_value: null, value_status: missing_row}
          - {country_id: ZAF, indicator_id: X, observation_year: 2023, indicator_value: null, value_status: null_value}
          - {country_id: ZAF, indicator_id: X, observation_year: 2024, indicator_value: null, value_status: missing_row}
      - input: ref('dim_countries')
        rows:
          - {country_id: BRA, country_name: Brazil}
          - {country_id: IND, country_name: India}
          - {country_id: ZAF, country_name: South Africa}
      - input: ref('dim_indicators')
        rows:
          - {indicator_id: X, indicator_name: An indicator}
    expect:
      rows:
        - {country_id: BRA, latest_year: 2024, latest_value: 12, latest_rank: 2,
           common_year: null, common_value: null, common_rank: null}
        - {country_id: IND, latest_year: 2023, latest_value: 30, latest_rank: 1,
           common_year: null, common_value: null, common_rank: null}
        - {country_id: ZAF, latest_year: null, latest_value: null, latest_rank: null,
           common_year: null, common_value: null, common_rank: null}

  - name: income_groups_aggregate_each_indicator_by_its_nature
    description: >
      Two of three high-income countries have population and GDP: those are summed; GDP per
      capita is total GDP over total population (6000 / 300 = 20, not the average of the
      countries' 10 and 40, 25); life expectancy is weighted by population
      ((80 * 200 + 70 * 100) / 300). GBR has a life expectancy but no population, so it drops out
      of the weighted mean, and the coverage says 2 of 3.
    model: rpt_income_group_by_year
    given:
      - input: ref('fct_country_indicator_values')
        rows:
          - {country_id: USA, indicator_id: SP.POP.TOTL, observation_year: 2024, indicator_value: 200}
          - {country_id: DEU, indicator_id: SP.POP.TOTL, observation_year: 2024, indicator_value: 100}
          - {country_id: GBR, indicator_id: SP.POP.TOTL, observation_year: 2024, indicator_value: null}
          - {country_id: USA, indicator_id: NY.GDP.MKTP.CD, observation_year: 2024, indicator_value: 2000}
          - {country_id: DEU, indicator_id: NY.GDP.MKTP.CD, observation_year: 2024, indicator_value: 4000}
          - {country_id: GBR, indicator_id: NY.GDP.MKTP.CD, observation_year: 2024, indicator_value: null}
          - {country_id: USA, indicator_id: NY.GDP.PCAP.CD, observation_year: 2024, indicator_value: 10}
          - {country_id: DEU, indicator_id: NY.GDP.PCAP.CD, observation_year: 2024, indicator_value: 40}
          - {country_id: GBR, indicator_id: NY.GDP.PCAP.CD, observation_year: 2024, indicator_value: null}
          - {country_id: USA, indicator_id: SP.DYN.LE00.IN, observation_year: 2024, indicator_value: 80}
          - {country_id: DEU, indicator_id: SP.DYN.LE00.IN, observation_year: 2024, indicator_value: 70}
          - {country_id: GBR, indicator_id: SP.DYN.LE00.IN, observation_year: 2024, indicator_value: 90}
      - input: ref('dim_countries')
        rows:
          - {country_id: USA, income_group_id: HIC}
          - {country_id: DEU, income_group_id: HIC}
          - {country_id: GBR, income_group_id: HIC}
      - input: ref('dim_income_groups')
        rows:
          - {income_group_id: HIC, income_group_name: High income}
      - input: ref('dim_indicators')
        rows:
          - {indicator_id: SP.POP.TOTL, indicator_name: Population}
          - {indicator_id: NY.GDP.MKTP.CD, indicator_name: GDP}
          - {indicator_id: NY.GDP.PCAP.CD, indicator_name: GDP per capita}
          - {indicator_id: SP.DYN.LE00.IN, indicator_name: Life expectancy}
    expect:
      rows:
        - {indicator_id: SP.POP.TOTL, aggregation: sum, group_value: 300, n_countries: 3,
           n_countries_with_data: 2}
        - {indicator_id: NY.GDP.MKTP.CD, aggregation: sum, group_value: 6000, n_countries: 3,
           n_countries_with_data: 2}
        - {indicator_id: NY.GDP.PCAP.CD, aggregation: total GDP / total population,
           group_value: 20, n_countries: 3, n_countries_with_data: 2}
        - {indicator_id: SP.DYN.LE00.IN, aggregation: population-weighted mean,
           group_value: 76.66666666666667, n_countries: 3, n_countries_with_data: 2}

  - name: an_income_group_without_data_has_a_null_value_not_zero
    model: rpt_income_group_by_year
    given:
      - input: ref('fct_country_indicator_values')
        rows:
          - {country_id: IND, indicator_id: SP.POP.TOTL, observation_year: 2024, indicator_value: null}
      - input: ref('dim_countries')
        rows:
          - {country_id: IND, income_group_id: LMC}
      - input: ref('dim_income_groups')
        rows:
          - {income_group_id: LMC, income_group_name: Lower middle income}
      - input: ref('dim_indicators')
        rows:
          - {indicator_id: SP.POP.TOTL, indicator_name: Population}
    expect:
      rows:
        - {income_group_id: LMC, indicator_id: SP.POP.TOTL, group_value: null, n_countries: 1,
           n_countries_with_data: 0}
