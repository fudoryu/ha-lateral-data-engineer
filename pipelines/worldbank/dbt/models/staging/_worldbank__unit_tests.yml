version: 2

# Unit tests for the staging logic: small hand-written inputs, exact expected outputs. They run
# inside `dbt build`, before the models they test, so `just build` and `just check` run them.

unit_tests:
  - name: expected_cells_cover_every_configured_country_indicator_and_year
    description: The expected set is the full cross product of the run's recorded scope (ADR-0008).
    model: stg_worldbank__expected_cells
    given:
      - input: source('worldbank', 'landing_runs')
        rows:
          - run_id: run-1
            config: >-
              {"scope": {"countries": ["BRA", "IND"], "indicators": ["SP.POP.TOTL"],
              "years": {"start": 2018, "end": 2019}}}
    expect:
      rows:
        - {run_id: run-1, country_id: BRA, indicator_id: SP.POP.TOTL, observation_year: 2018}
        - {run_id: run-1, country_id: BRA, indicator_id: SP.POP.TOTL, observation_year: 2019}
        - {run_id: run-1, country_id: IND, indicator_id: SP.POP.TOTL, observation_year: 2018}
        - {run_id: run-1, country_id: IND, indicator_id: SP.POP.TOTL, observation_year: 2019}

  - name: observations_keep_null_values_null_and_blank_units_null
    description: >
      A JSON null value stays null, never 0 (NFR-3); blank units become null; the source's
      lastupdated comes from the page metadata.
    model: stg_worldbank__observations
    given:
      - input: source('worldbank', 'api_responses')
        rows:
          - response_id: run-1/endpoint=observations/SP.POP.TOTL/page=1.json
            run_id: run-1
            endpoint: observations
            url: https://api.worldbank.org/v2/x
            fetched_at: 2026-11-24 18:30:00
            payload: >-
              [{"page": 1, "pages": 1, "per_page": 50, "total": 2, "lastupdated": "2026-11-11"},
              [{"indicator": {"id": "SP.POP.TOTL", "value": "Population, total"},
                "country": {"id": "BR", "value": "Brazil"}, "countryiso3code": "BRA",
                "date": "2024", "value": null, "unit": "", "obs_status": "", "decimal": 0},
               {"indicator": {"id": "SP.POP.TOTL", "value": "Population, total"},
                "country": {"id": "BR", "value": "Brazil"}, "countryiso3code": "BRA",
                "date": "2023", "value": 211.5, "unit": "", "obs_status": "", "decimal": 1}]]
          - response_id: run-1/endpoint=countries/page=1.json
            run_id: run-1
            endpoint: countries
            payload: '[{"page": 1, "pages": 1, "per_page": 50, "total": 0}, []]'
    expect:
      rows:
        - country_id: BRA
          indicator_id: SP.POP.TOTL
          observation_year: 2024
          indicator_value: null
          unit: null
          obs_status: null
          source_response_id: run-1/endpoint=observations/SP.POP.TOTL/page=1.json
          source_lastupdated: 2026-11-11
        - country_id: BRA
          indicator_id: SP.POP.TOTL
          observation_year: 2023
          indicator_value: 211.5
          unit: null
          obs_status: null
          source_response_id: run-1/endpoint=observations/SP.POP.TOTL/page=1.json
          source_lastupdated: 2026-11-11

  - name: countries_have_normalized_names
    description: >
      Names are trimmed, internal runs of whitespace (double spaces, tabs) become one space, and
      an empty name becomes null (source-system §2, ADR-0033).
    model: stg_worldbank__countries
    given:
      - input: source('worldbank', 'api_responses')
        rows:
          - response_id: run-1/endpoint=countries/page=1.json
            run_id: run-1
            endpoint: countries
            payload: >-
              [{"page": 1, "pages": 1, "per_page": 50, "total": 1},
              [{"id": "BRA", "iso2Code": "BR", "name": "Brazil ",
                "region": {"id": "LCN", "iso2code": "ZJ", "value": " Latin  America &\tCaribbean "},
                "incomeLevel": {"id": "UMC", "iso2code": "XT", "value": "Upper middle income "}},
               {"id": "XKX", "iso2Code": "XK", "name": "   ",
                "region": {"id": "ECS", "iso2code": "Z7", "value": "Europe & Central Asia"},
                "incomeLevel": {"id": "UMC", "iso2code": "XT", "value": "Upper middle income"}}]]
    expect:
      rows:
        - country_id: BRA
          country_name: Brazil
          region_id: LCN
          region_name: Latin America & Caribbean
          income_group_id: UMC
          income_group_name: Upper middle income
        - country_id: XKX
          country_name: null
          region_id: ECS
          region_name: Europe & Central Asia
          income_group_id: UMC
          income_group_name: Upper middle income

  - name: responses_take_lastupdated_from_the_page_metadata
    description: Observation pages carry the source's release date; metadata pages don't.
    model: stg_worldbank__responses
    given:
      - input: source('worldbank', 'api_responses')
        rows:
          - response_id: run-1/endpoint=observations/SP.POP.TOTL/page=1.json
            run_id: run-1
            endpoint: observations
            request_key: SP.POP.TOTL
            page: 1
            payload: '[{"page": 1, "pages": 1, "total": 0, "lastupdated": "2026-11-11"}, []]'
          - response_id: run-1/endpoint=countries/page=1.json
            run_id: run-1
            endpoint: countries
            page: 1
            payload: '[{"page": 1, "pages": 1, "total": 0}, []]'
    expect:
      rows:
        - source_response_id: run-1/endpoint=observations/SP.POP.TOTL/page=1.json
          request_key: SP.POP.TOTL
          source_lastupdated: 2026-11-11
        - source_response_id: run-1/endpoint=countries/page=1.json
          request_key: null
          source_lastupdated: null
