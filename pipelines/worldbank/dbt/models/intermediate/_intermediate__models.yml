version: 2

models:
  - name: int_runs_ranked
    description: >
      Every committed run, ranked from the most recent commit; `is_latest` marks the run whose
      rows are current state (ADR-0006). The only model that decides which run is the latest.
    columns:
      - name: run_id
        data_tests: [unique, not_null]
      - name: recency_rank
        data_tests: [unique, not_null]
      - name: is_latest
        data_tests: [not_null]

  - name: int_responses_joined_to_runs
    description: Every landed page, with `is_latest_run` for the pages behind current state.
    columns:
      - name: source_response_id
        data_tests: [unique, not_null]
      - name: run_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_runs_ranked')
                field: run_id
      - name: is_latest_run
        data_tests: [not_null]

  - name: int_countries_filtered_to_latest_run
    description: The latest run's countries, with each one's current income group (ADR-0011).
    columns:
      - name: country_id
        data_tests: [unique, not_null]
      - name: income_group_id
        data_tests: [not_null]
      - name: source_response_id
        data_tests: [not_null]

  - name: int_indicators_filtered_to_latest_run
    description: The latest run's indicators.
    columns:
      - name: indicator_id
        data_tests: [unique, not_null]
      - name: source_response_id
        data_tests: [not_null]

  - name: int_indicator_values_joined_to_expected
    description: >
      Every run's expected cells with what the API returned: `value_status` is `present`,
      `null_value` (row returned with a null value) or `missing_row` (no row) (ADR-0008).
    data_tests:
      - unique_combination:
          arguments:
            columns: [run_id, country_id, indicator_id, observation_year]
    columns:
      - name: value_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [present, null_value, missing_row]

  - name: int_indicator_values_filtered_to_latest_run
    description: The latest run's cells, one per expected country × indicator × year.
    data_tests:
      - unique_combination:
          arguments:
            columns: [country_id, indicator_id, observation_year]
    columns:
      - name: run_id
        data_tests: [not_null]

  - name: int_indicator_values_versioned
    description: >
      One row per version of each cell's value across runs: a new version starts when the value
      or status changes; valid from `valid_from_run_id` until `valid_to_run_id` (exclusive, null
      while open); `is_current` marks the version the latest run holds (ADR-0006, ADR-0017).
    data_tests:
      - unique_combination:
          arguments:
            columns: [country_id, indicator_id, observation_year, valid_from_run_id]
    columns:
      - name: is_current
        data_tests: [not_null]

  - name: int_indicators_joined_to_latest_observations
    description: >
      The latest run's indicators with the World Bank release their current values come from
      (`source_lastupdated`, from the latest run's observation pages).
    columns:
      - name: indicator_id
        data_tests: [unique, not_null]

  - name: int_regions_derived_from_countries
    description: >
      The distinct regions of the latest run's countries (ADR-0039). A region id with two names
      fails `unique`, rather than producing two regions.
    columns:
      - name: region_id
        data_tests: [unique, not_null]

  - name: int_countries_joined_to_income_groups
    description: >
      The latest run's countries with their income group's low-to-high sort order (seed
      income_groups; ADR-0030).
    columns:
      - name: country_id
        data_tests: [unique, not_null]
      - name: income_group_sort_order
        description: A group missing from the seed fails the build, so a new group isn't unsorted.
        data_tests: [not_null]
