version: 2

unit_tests:
  - name: the_most_recently_committed_run_is_the_latest
    description: Ranking follows commit time, not the order of run IDs.
    model: int_runs_ranked
    given:
      - input: ref('stg_worldbank__runs')
        rows:
          - {run_id: run-a, committed_at: 2026-11-25 10:00:00}
          - {run_id: run-b, committed_at: 2026-11-24 10:00:00}
          - {run_id: run-c, committed_at: 2026-11-23 10:00:00}
    expect:
      rows:
        - {run_id: run-a, recency_rank: 1, is_latest: true}
        - {run_id: run-b, recency_rank: 2, is_latest: false}
        - {run_id: run-c, recency_rank: 3, is_latest: false}

  - name: runs_committed_at_the_same_moment_are_ranked_by_run_id
    description: A tie on commit time still gives exactly one latest run.
    model: int_runs_ranked
    given:
      - input: ref('stg_worldbank__runs')
        rows:
          - {run_id: run-a, committed_at: 2026-11-25 10:00:00}
          - {run_id: run-b, committed_at: 2026-11-25 10:00:00}
    expect:
      rows:
        - {run_id: run-b, recency_rank: 1, is_latest: true}
        - {run_id: run-a, recency_rank: 2, is_latest: false}

  - name: responses_are_flagged_when_they_belong_to_the_latest_run
    model: int_responses_joined_to_runs
    given:
      - input: ref('stg_worldbank__responses')
        rows:
          - {source_response_id: run-a/endpoint=countries/page=1.json, run_id: run-a}
          - {source_response_id: run-b/endpoint=countries/page=1.json, run_id: run-b}
      - input: ref('int_runs_ranked')
        rows:
          - {run_id: run-a, is_latest: true}
          - {run_id: run-b, is_latest: false}
    expect:
      rows:
        - {source_response_id: run-a/endpoint=countries/page=1.json, is_latest_run: true}
        - {source_response_id: run-b/endpoint=countries/page=1.json, is_latest_run: false}

  - name: countries_come_from_the_latest_run_only
    description: A country renamed or reclassified between runs shows its latest metadata.
    model: int_countries_filtered_to_latest_run
    given:
      - input: ref('stg_worldbank__countries')
        rows:
          - {run_id: run-old, country_iso3: IND, country_name: India, income_level_id: LIC}
          - {run_id: run-new, country_iso3: IND, country_name: India, income_level_id: LMC}
      - input: ref('int_runs_ranked')
        rows:
          - {run_id: run-old, is_latest: false}
          - {run_id: run-new, is_latest: true}
    expect:
      rows:
        - {country_iso3: IND, income_level_id: LMC, run_id: run-new}

  - name: indicators_come_from_the_latest_run_only
    model: int_indicators_filtered_to_latest_run
    given:
      - input: ref('stg_worldbank__indicators')
        rows:
          - {run_id: run-old, indicator_id: SP.POP.TOTL, indicator_name: Population}
          - {run_id: run-new, indicator_id: SP.POP.TOTL, indicator_name: "Population, total"}
      - input: ref('int_runs_ranked')
        rows:
          - {run_id: run-old, is_latest: false}
          - {run_id: run-new, is_latest: true}
    expect:
      rows:
        - {indicator_id: SP.POP.TOTL, indicator_name: "Population, total", run_id: run-new}

  - name: each_expected_cell_is_present_null_or_missing
    description: >
      A returned value is present, a returned null is null_value, and no row at all is
      missing_row, with no source response; none of them becomes 0 (ADR-0008, NFR-3).
    model: int_indicator_values_joined_to_expected
    given:
      - input: ref('stg_worldbank__expected_cells')
        rows:
          - {run_id: run-1, country_iso3: BRA, indicator_id: SP.POP.TOTL, observation_year: 2022}
          - {run_id: run-1, country_iso3: BRA, indicator_id: SP.POP.TOTL, observation_year: 2023}
          - {run_id: run-1, country_iso3: BRA, indicator_id: SP.POP.TOTL, observation_year: 2024}
      - input: ref('stg_worldbank__observations')
        rows:
          - run_id: run-1
            country_iso3: BRA
            indicator_id: SP.POP.TOTL
            observation_year: 2022
            indicator_value: 211.5
            source_response_id: page-1
          - run_id: run-1
            country_iso3: BRA
            indicator_id: SP.POP.TOTL
            observation_year: 2023
            indicator_value: null
            source_response_id: page-1
    expect:
      rows:
        - observation_year: 2022
          indicator_value: 211.5
          value_status: present
          source_response_id: page-1
        - observation_year: 2023
          indicator_value: null
          value_status: null_value
          source_response_id: page-1
        - observation_year: 2024
          indicator_value: null
          value_status: missing_row
          source_response_id: null

  - name: current_cells_come_from_the_latest_run_only
    description: A value revised in a later run shows the later value (ADR-0006).
    model: int_indicator_values_filtered_to_latest_run
    given:
      - input: ref('int_indicator_values_joined_to_expected')
        rows:
          - {run_id: run-old, country_iso3: IND, indicator_id: SP.POP.TOTL, observation_year: 2019,
             indicator_value: 1383.1, value_status: present}
          - {run_id: run-new, country_iso3: IND, indicator_id: SP.POP.TOTL, observation_year: 2019,
             indicator_value: 1405.7, value_status: present}
      - input: ref('int_runs_ranked')
        rows:
          - {run_id: run-old, is_latest: false}
          - {run_id: run-new, is_latest: true}
    expect:
      rows:
        - {country_iso3: IND, observation_year: 2019, indicator_value: 1405.7, run_id: run-new}

  - name: an_unchanged_value_is_one_current_version
    model: int_indicator_values_versioned
    given:
      - input: ref('int_indicator_values_joined_to_expected')
        rows:
          - {run_id: run-1, country_iso3: IND, indicator_id: SP.POP.TOTL, observation_year: 2019, indicator_value: 1405.7, value_status: present}
          - {run_id: run-2, country_iso3: IND, indicator_id: SP.POP.TOTL, observation_year: 2019, indicator_value: 1405.7, value_status: present}
          - {run_id: run-3, country_iso3: IND, indicator_id: SP.POP.TOTL, observation_year: 2019, indicator_value: 1405.7, value_status: present}
      - input: ref('int_runs_ranked')
        rows:
          - {run_id: run-1, committed_at: 2026-11-01 00:00:00, is_latest: false}
          - {run_id: run-2, committed_at: 2026-11-02 00:00:00, is_latest: false}
          - {run_id: run-3, committed_at: 2026-11-03 00:00:00, is_latest: true}
    expect:
      rows:
        - {valid_from_run_id: run-1, valid_to_run_id: null, indicator_value: 1405.7, is_current: true}

  - name: a_revision_closes_the_old_version_and_opens_a_new_one
    description: The source revised India's 2019 population silently (source-system §7).
    model: int_indicator_values_versioned
    given:
      - input: ref('int_indicator_values_joined_to_expected')
        rows:
          - {run_id: run-1, country_iso3: IND, indicator_id: SP.POP.TOTL, observation_year: 2019, indicator_value: 1383.1, value_status: present}
          - {run_id: run-2, country_iso3: IND, indicator_id: SP.POP.TOTL, observation_year: 2019, indicator_value: 1405.7, value_status: present}
          - {run_id: run-3, country_iso3: IND, indicator_id: SP.POP.TOTL, observation_year: 2019, indicator_value: 1405.7, value_status: present}
      - input: ref('int_runs_ranked')
        rows:
          - {run_id: run-1, committed_at: 2026-11-01 00:00:00, is_latest: false}
          - {run_id: run-2, committed_at: 2026-11-02 00:00:00, is_latest: false}
          - {run_id: run-3, committed_at: 2026-11-03 00:00:00, is_latest: true}
    expect:
      rows:
        - {valid_from_run_id: run-1, valid_to_run_id: run-2, indicator_value: 1383.1, is_current: false}
        - {valid_from_run_id: run-2, valid_to_run_id: null, indicator_value: 1405.7, is_current: true}

  - name: a_change_of_status_is_a_new_version
    description: A null value that later gets a number, then goes missing, is three versions.
    model: int_indicator_values_versioned
    given:
      - input: ref('int_indicator_values_joined_to_expected')
        rows:
          - {run_id: run-1, country_iso3: IND, indicator_id: SP.POP.TOTL, observation_year: 2019, indicator_value: null, value_status: null_value}
          - {run_id: run-2, country_iso3: IND, indicator_id: SP.POP.TOTL, observation_year: 2019, indicator_value: 1405.7, value_status: present}
          - {run_id: run-3, country_iso3: IND, indicator_id: SP.POP.TOTL, observation_year: 2019, indicator_value: null, value_status: missing_row}
      - input: ref('int_runs_ranked')
        rows:
          - {run_id: run-1, committed_at: 2026-11-01 00:00:00, is_latest: false}
          - {run_id: run-2, committed_at: 2026-11-02 00:00:00, is_latest: false}
          - {run_id: run-3, committed_at: 2026-11-03 00:00:00, is_latest: true}
    expect:
      rows:
        - {valid_from_run_id: run-1, valid_to_run_id: run-2, value_status: null_value, is_current: false}
        - {valid_from_run_id: run-2, valid_to_run_id: run-3, value_status: present, is_current: false}
        - {valid_from_run_id: run-3, valid_to_run_id: null, value_status: missing_row, is_current: true}

  - name: a_cell_dropped_from_the_scope_keeps_its_history_without_a_current_version
    model: int_indicator_values_versioned
    given:
      - input: ref('int_indicator_values_joined_to_expected')
        rows:
          - {run_id: run-1, country_iso3: IND, indicator_id: SP.POP.TOTL, observation_year: 2019, indicator_value: 1405.7, value_status: present}
          - {run_id: run-2, country_iso3: IND, indicator_id: SP.POP.TOTL, observation_year: 2019, indicator_value: 1405.7, value_status: present}
      - input: ref('int_runs_ranked')
        rows:
          - {run_id: run-1, committed_at: 2026-11-01 00:00:00, is_latest: false}
          - {run_id: run-2, committed_at: 2026-11-02 00:00:00, is_latest: false}
          - {run_id: run-3, committed_at: 2026-11-03 00:00:00, is_latest: true}
    expect:
      rows:
        - {valid_from_run_id: run-1, valid_to_run_id: null, indicator_value: 1405.7, is_current: false}

  - name: indicators_get_their_aggregation_method
    model: int_indicators_joined_to_aggregations
    given:
      - input: ref('int_indicators_joined_to_releases')
        rows:
          - {indicator_id: NY.GDP.PCAP.CD}
          - {indicator_id: NEW.INDICATOR}
      - input: ref('indicator_aggregations')
        rows:
          - indicator_id: NY.GDP.PCAP.CD
            aggregation_method: ratio
            numerator_indicator_id: NY.GDP.MKTP.CD
            denominator_indicator_id: SP.POP.TOTL
    expect:
      rows:
        - indicator_id: NY.GDP.PCAP.CD
          aggregation_method: ratio
          numerator_indicator_id: NY.GDP.MKTP.CD
          denominator_indicator_id: SP.POP.TOTL
        - indicator_id: NEW.INDICATOR
          aggregation_method: null
          numerator_indicator_id: null
          denominator_indicator_id: null

  - name: the_current_income_group_applies_to_every_reporting_year
    model: int_income_groups_spread_over_years
    given:
      - input: ref('int_countries_filtered_to_latest_run')
        rows:
          - {country_iso3: IND, income_level_id: LMC}
      - input: ref('int_indicator_values_filtered_to_latest_run')
        rows:
          - {observation_year: 2018}
          - {observation_year: 2019}
          - {observation_year: 2019}
      - input: ref('int_runs_ranked')
        rows:
          - {committed_at: 2026-11-25 01:51:43, is_latest: true}
          - {committed_at: 2026-11-24 10:00:00, is_latest: false}
    expect:
      rows:
        - {country_iso3: IND, observation_year: 2018, income_level_id: LMC,
           classification_basis: current_applied_to_all_years, classified_as_of: 2026-11-25}
        - {country_iso3: IND, observation_year: 2019, income_level_id: LMC,
           classification_basis: current_applied_to_all_years, classified_as_of: 2026-11-25}

  - name: indicators_get_the_release_of_their_latest_observations
    description: >
      The date comes from the latest run's observation pages only: not from metadata pages, not
      from older runs. An indicator without observation pages has none.
    model: int_indicators_joined_to_releases
    given:
      - input: ref('int_indicators_filtered_to_latest_run')
        rows:
          - {indicator_id: SP.POP.TOTL}
          - {indicator_id: NEW.INDICATOR}
      - input: ref('int_responses_joined_to_runs')
        rows:
          - {request_key: SP.POP.TOTL, endpoint: observations, is_latest_run: true,
             source_lastupdated: 2026-11-11}
          - {request_key: SP.POP.TOTL, endpoint: observations, is_latest_run: true,
             source_lastupdated: 2026-11-11}
          - {request_key: SP.POP.TOTL, endpoint: observations, is_latest_run: false,
             source_lastupdated: 2026-07-01}
          - {request_key: NEW.INDICATOR, endpoint: indicators, is_latest_run: true,
             source_lastupdated: null}
    expect:
      rows:
        - {indicator_id: SP.POP.TOTL, source_lastupdated: 2026-11-11}
        - {indicator_id: NEW.INDICATOR, source_lastupdated: null}
