version: 2

# The final data model for analysts (ADR-0017, ADR-0028, FR-MOD-2): a current-state star schema at
# natural keys, latest run only. Every description states the table's grain, key and
# relationships; the tests below enforce them. Run-level lineage and history stay in
# intermediate, for engineers (see analyses/trace_value.sql).

models:
  - name: dim_country
    description: >
      Grain: one configured country, latest run. Key: `country_iso3`. `income_level_id` is the
      current classification; yearly groups are in dim_country_income_group_by_year (ADR-0011).
    columns:
      - name: country_iso3
        data_tests: [unique, not_null]
      - name: income_level_id
        data_tests: [not_null]

  - name: dim_indicator
    description: >
      Grain: one configured indicator, latest run. Key: `indicator_id`. Includes how it aggregates
      across an income group: `aggregation_method` and the indicators it combines (ADR-0009).
    columns:
      - name: indicator_id
        data_tests: [unique, not_null]
      - name: aggregation_method
        data_tests: [not_null]

  - name: dim_country_income_group_by_year
    description: >
      Grain: one country and reporting year. Key: (`country_iso3`, `observation_year`).
      Relationships: `country_iso3` → dim_country. Facts join it on country and year, never on a
      country attribute, so the yearly basis can change without changing reports (ADR-0011).
    data_tests:
      - unique_combination:
          arguments:
            columns: [country_iso3, observation_year]
    columns:
      - name: country_iso3
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_iso3

  - name: fct_indicator_value
    description: >
      Grain: one expected country × indicator × year of the latest run (current state). Key:
      (`country_iso3`, `indicator_id`, `observation_year`). Relationships: → dim_country,
      dim_indicator, dim_country_income_group_by_year (on country and year). `value_status` is
      present, null_value or missing_row; the value is null unless present, and missing rows
      have no source response (ADR-0008, NFR-3).
    data_tests:
      - unique_combination:
          arguments:
            columns: [country_iso3, indicator_id, observation_year]
    columns:
      - name: country_iso3
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_iso3
      - name: indicator_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_indicator')
                field: indicator_id
      - name: value_status
        data_tests:
          - accepted_values:
              arguments:
                values: [present, null_value, missing_row]
      - name: source_response_id
        description: >
          Technical lineage, not for analysis (ADR-0028): the landed page the value came from,
          which is also its path in the landing zone. Null exactly when the status is
          missing_row. Trace it with analyses/trace_value.sql.
        data_tests:
          - relationships:
              arguments:
                to: ref('int_responses_joined_to_runs')
                field: source_response_id
