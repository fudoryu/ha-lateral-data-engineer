version: 2

# The final data model for analysts (ADR-0017, ADR-0028, FR-MOD-2): a current-state star schema at
# natural keys, latest run only. Every description states the table's grain, key and
# relationships; the tests below enforce them. Each row carries one technical lineage column,
# `source_response_id`; runs, pages and history stay in intermediate, for engineers (see
# analyses/trace_value.sql).

models:
  - name: dim_countries
    description: >
      Grain: one configured country, latest run. Key: `country_id`. Relationships: →
      dim_regions, → dim_income_groups.
    data_tests:
      - expression_is_true:
          arguments:
            expression: >-
              length(country_id) = 3 AND country_id = upper(country_id)
              AND length(country_iso2) = 2 AND country_iso2 = upper(country_iso2)
    columns:
      - name: country_id
        description: The country's ISO 3166-1 alpha-3 code, e.g. `BRA`.
        data_tests: [unique, not_null]
      - name: country_iso2
        description: The country's ISO 3166-1 alpha-2 code, e.g. `BR`; an attribute, not the key.
        data_tests: [unique, not_null]
      - name: country_name
        data_tests: [not_null]
      - name: region_id
        description: The World Bank's region code, e.g. `LCN`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_regions')
                field: region_id
      - name: income_group_id
        description: The World Bank's income group code, e.g. `UMC`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_income_groups')
                field: income_group_id

  - name: dim_regions
    description: >
      Grain: one region of the latest run's countries. Key: `region_id`, the World Bank's region
      code (ADR-0039). Derived from the countries, which are the only place the API describes a
      region, so it has no lineage column of its own; trace it through dim_countries.
    columns:
      - name: region_id
        data_tests: [unique, not_null]
      - name: region_name
        data_tests: [not_null]

  - name: dim_income_groups
    description: >
      Grain: one income group of the latest run's countries. Key: `income_group_id`, the World
      Bank's income group code (ADR-0040). It's the current classification, which the analysis
      applies to every year (ADR-0011). Derived from the countries, which are the only place the
      API describes an income group, so it has no lineage column of its own; trace it through
      dim_countries.
    columns:
      - name: income_group_id
        data_tests: [unique, not_null]
      - name: income_group_name
        data_tests: [not_null]

  - name: dim_indicators
    description: >
      Grain: one configured indicator, latest run. Key: `indicator_id`. Includes the World Bank
      release its current values come from (`source_lastupdated`).
    columns:
      - name: indicator_id
        data_tests: [unique, not_null]
      - name: source_organization
        description: The organizations the World Bank cites as producing this indicator's data.
      - name: source_lastupdated
        description: >
          The World Bank's release date for this indicator's current values ("data as of"), from
          the latest run's observation pages.
      - name: source_response_id
        description: >
          Technical lineage (ADR-0028): the landed metadata page this row comes from. Values, and
          the pages their release date is read from, trace through the fact's own
          `source_response_id`.

  - name: fct_country_indicator_values
    description: >
      Grain: one expected country × indicator × year of the latest run (current state). Key:
      (`country_id`, `indicator_id`, `observation_year`). Relationships: → dim_countries,
      dim_indicators. `value_status` is
      present, null_value or missing_row; the value is null unless present, and missing rows
      have no source response (ADR-0008, NFR-3).
    data_tests:
      - unique_combination:
          arguments:
            columns: [country_id, indicator_id, observation_year]
    columns:
      - name: country_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_countries')
                field: country_id
      - name: indicator_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_indicators')
                field: indicator_id
      - name: value_status
        data_tests:
          - accepted_values:
              arguments:
                values: [present, null_value, missing_row]
      - name: source_response_id
        description: >
          Technical lineage, not for analysis (ADR-0028): the landed page the value came from,
          which is also its path in the landing zone. Null exactly when the status is
          missing_row. Trace it with analyses/trace_value.sql.
        data_tests:
          - relationships:
              arguments:
                to: ref('int_responses_joined_to_runs')
                field: source_response_id
