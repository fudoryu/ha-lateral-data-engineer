version: 2

# The final data model for analysts (ADR-0017, ADR-0028, FR-MOD-2): a current-state star schema at
# natural keys, latest run only. Every description states the table's grain, key and
# relationships; the tests below enforce them. Each row carries one technical lineage column,
# `source_response_id`; runs, pages and history stay in intermediate, for engineers (see
# analyses/trace_value.sql).

models:
  - name: dim_countries
    description: >
      Grain: one configured country, latest run. Key: `country_id`. Its income group is the
      current classification, which the analysis applies to every year (ADR-0011, ADR-0030);
      `income_group_sort_order` lists groups from low to high income.
    data_tests:
      - expression_is_true:
          arguments:
            expression: "length(country_id) = 3 AND country_id = upper(country_id)"
    columns:
      - name: country_id
        description: The country's ISO 3166-1 alpha-3 code, e.g. `BRA`.
        data_tests: [unique, not_null]
      - name: income_group_id
        data_tests: [not_null]
      - name: income_group_sort_order
        description: Low to high income (1 = low income). Never null, so reports always sort.
        data_tests: [not_null]

  - name: dim_indicators
    description: >
      Grain: one configured indicator, latest run. Key: `indicator_id`. Includes the World Bank
      release its current values come from (`source_lastupdated`) and how it aggregates across an
      income group: `aggregation_method` and the indicators it combines (ADR-0009).
    columns:
      - name: indicator_id
        data_tests: [unique, not_null]
      - name: source_lastupdated
        description: >
          The World Bank's release date for this indicator's current values ("data as of"), from
          the latest run's observation pages.
      - name: display_decimals
        description: How many decimals the World Bank publishes this indicator's values with.
      - name: numerator_indicator_id
        description: For `ratio`, the indicator summed on top; must be a configured indicator.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_indicators')
                field: indicator_id
      - name: denominator_indicator_id
        description: For `ratio`, the indicator summed below; must be a configured indicator.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_indicators')
                field: indicator_id
      - name: weight_indicator_id
        description: For `weighted_mean`, the indicator that weights each country; must be a configured indicator.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_indicators')
                field: indicator_id
      - name: aggregation_method
        data_tests: [not_null]

  - name: fct_country_indicator_values
    description: >
      Grain: one expected country × indicator × year of the latest run (current state). Key:
      (`country_id`, `indicator_id`, `observation_year`). Relationships: → dim_countries,
      dim_indicators. `value_status` is
      present, null_value or missing_row; the value is null unless present, and missing rows
      have no source response (ADR-0008, NFR-3).
    data_tests:
      - unique_combination:
          arguments:
            columns: [country_id, indicator_id, observation_year]
    columns:
      - name: country_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_countries')
                field: country_id
      - name: indicator_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_indicators')
                field: indicator_id
      - name: value_status
        data_tests:
          - accepted_values:
              arguments:
                values: [present, null_value, missing_row]
      - name: source_response_id
        description: >
          Technical lineage, not for analysis (ADR-0028): the landed page the value came from,
          which is also its path in the landing zone. Null exactly when the status is
          missing_row. Trace it with analyses/trace_value.sql.
        data_tests:
          - relationships:
              arguments:
                to: ref('int_responses_joined_to_runs')
                field: source_response_id
