version: 2

# The final data model (ADR-0017, FR-MOD-2): a star schema at natural keys. Every description
# states the table's grain, key and relationships; the tests below enforce them.

models:
  - name: dim_run
    description: >
      Grain: one committed extract run. Key: `run_id`. `is_latest` marks the run whose rows are
      current state (ADR-0006).
    columns:
      - name: run_id
        data_tests: [unique, not_null]
      - name: is_latest
        data_tests: [not_null]

  - name: dim_source_response
    description: >
      Grain: one landed API response page. Key: `source_response_id`, the page's landing path.
      Relationships: `run_id` → dim_run. Where every value came from (NFR-1).
    columns:
      - name: source_response_id
        data_tests: [unique, not_null]
      - name: run_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_run')
                field: run_id

  - name: dim_country
    description: >
      Grain: one configured country, latest run. Key: `country_iso3`. `income_level_id` is the
      current classification; yearly groups are in dim_country_income_group_by_year (ADR-0011).
    columns:
      - name: country_iso3
        data_tests: [unique, not_null]
      - name: income_level_id
        data_tests: [not_null]

  - name: dim_indicator
    description: >
      Grain: one configured indicator, latest run. Key: `indicator_id`. Includes how it aggregates
      across an income group: `aggregation_method` and the indicators it combines (ADR-0009).
    columns:
      - name: indicator_id
        data_tests: [unique, not_null]
      - name: aggregation_method
        data_tests: [not_null]

  - name: dim_country_income_group_by_year
    description: >
      Grain: one country and reporting year. Key: (`country_iso3`, `observation_year`).
      Relationships: `country_iso3` → dim_country. Facts join it on country and year, never on a
      country attribute, so the yearly basis can change without changing reports (ADR-0011).
    data_tests:
      - unique_combination:
          arguments:
            columns: [country_iso3, observation_year]
    columns:
      - name: country_iso3
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_iso3

  - name: fct_indicator_value
    description: >
      Grain: one expected country × indicator × year of the latest run (current state). Key:
      (`country_iso3`, `indicator_id`, `observation_year`). Relationships: → dim_country,
      dim_indicator, dim_country_income_group_by_year (on country and year), dim_run and
      dim_source_response. `value_status` is present, null_value or missing_row; the value is
      null unless present, and missing rows have no source response (ADR-0008, NFR-3).
    data_tests:
      - unique_combination:
          arguments:
            columns: [country_iso3, indicator_id, observation_year]
    columns:
      - name: country_iso3
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_iso3
      - name: indicator_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_indicator')
                field: indicator_id
      - name: value_status
        data_tests:
          - accepted_values:
              arguments:
                values: [present, null_value, missing_row]
      - name: run_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_run')
                field: run_id
      - name: source_response_id
        description: Null exactly when the status is missing_row.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_source_response')
                field: source_response_id

  - name: fct_indicator_value_versions
    description: >
      Grain: one version of a cell's value across runs. Key: (`country_iso3`, `indicator_id`,
      `observation_year`, `valid_from_run_id`). Relationships: → dim_country, dim_indicator,
      dim_run (`valid_from_run_id`, `valid_to_run_id`). A version is valid until
      `valid_to_run_id` (exclusive, null while open); `is_current` marks the version in
      fct_indicator_value (ADR-0006, ADR-0017).
    data_tests:
      - unique_combination:
          arguments:
            columns: [country_iso3, indicator_id, observation_year, valid_from_run_id]
    columns:
      - name: country_iso3
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_iso3
      - name: indicator_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_indicator')
                field: indicator_id
      - name: valid_from_run_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_run')
                field: run_id
      - name: valid_to_run_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_run')
                field: run_id
