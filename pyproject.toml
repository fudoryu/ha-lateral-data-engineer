[project]
name = "data-pipelines"
version = "0.1.0"
description = "Workspace root: the `pipeline` CLI and shared tooling for each source pipeline."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "typer>=0.29",
    "worldbank-pipeline",
]

[project.scripts]
pipeline = "pipeline_cli.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4",
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.10,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pipeline_cli"

[tool.uv.workspace]
members = ["pipelines/*"]

[tool.uv.sources]
worldbank-pipeline = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline_cli", "worldbank_pipeline"]

[tool.mypy]
strict = true
files = ["src", "tests", "pipelines/worldbank/src", "pipelines/worldbank/tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "pipelines/worldbank/tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
