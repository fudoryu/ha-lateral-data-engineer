# Workspace root: shared tooling and configuration only. All code lives in pipelines/<source>/ (ADR-0014).
[project]
name = "data-pipelines"
version = "0.1.0"
description = "Workspace root for the source pipelines under pipelines/."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "worldbank",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4",
    "pytest>=9.2",
    "pytest-cov>=7",
    "responses>=0.26",
    "ruff>=0.17",
    "types-pyyaml>=6.0.12.20261122",
    "types-requests>=2.33.0.20261030",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["pipelines/*"]

[tool.uv.sources]
worldbank = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["worldbank"]

[tool.mypy]
strict = true
files = ["pipelines/worldbank/src", "pipelines/worldbank/tests"]
mypy_path = "pipelines/worldbank/tests"

[tool.pytest.ini_options]
testpaths = ["pipelines/worldbank/tests"]
pythonpath = ["pipelines/worldbank/tests"]  # test helpers such as scenarios.py
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["worldbank"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
